# Baker's CI on github.com/zach/baker. Releases are built and tested before they are
# published; this checks pull requests and forks here.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-13 C++20,       os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "" }
          - { name: clang-18 C++20,     os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "" }
          - { name: clang-18 C++23,     os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 23, flags: "" }
          - { name: clang-18 libc++,    os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "-DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++", packages: "libc++-18-dev libc++abi-18-dev" }
          - { name: gcc-13 C++23,       os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 23, flags: "" }
          - { name: data only,          os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DBAKER_BUILD_SCRIPT=OFF" }
          - { name: asan+ubsan,         os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "-DBAKER_SANITIZE=address,undefined" }
          - { name: tsan,               os: ubuntu-24.04,  cc: clang-18, cxx: clang++-18, std: 20, flags: "-DBAKER_SANITIZE=thread" }
          - { name: plain refcounts,    os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DBAKER_ATOMIC_REFCOUNT=OFF" }
          - { name: shipping,           os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DBAKER_SHIPPING=ON" }
          - { name: eastl,              os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DBAKER_USE_EASTL=ON" }
          - { name: harness,            os: ubuntu-24.04,  cc: gcc-13,   cxx: g++-13,     std: 20, flags: "-DBAKER_BUILD_HARNESS=ON", packages: "libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev" }
          - { name: msvc C++20,         os: windows-2022,  cc: cl,       cxx: cl,         std: 20, flags: "-DBAKER_BUILD_HARNESS=ON" }
          - { name: msvc C++latest,     os: windows-2022,  cc: cl,       cxx: cl,         std: 23, flags: "" }
    env:
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          ${{ matrix.flags }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: |
          files=$(git ls-files '*.hpp' '*.cpp' ':!third_party')
          [ -z "$files" ] || clang-format-18 --dry-run --Werror $files

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy-18
      - name: clang-tidy over src (.clang-tidy)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBAKER_BUILD_TESTS=OFF -DBAKER_BUILD_EXAMPLES=OFF
          run-clang-tidy-18 -p build -quiet 'src/.*\.cpp$'
